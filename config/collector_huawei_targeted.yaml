# Complemento del walk Huawei: ramas XPON de alto valor que el walk completo no alcanzó
# (2.62 "ONT ethernet port cfg" es enorme y de bajo valor: 4 puertos × 1073 ONT × ~25 columnas).
# Se concatena con docs/walks/partial/Huawei_MA5608T.txt (walks parciales concatenados son válidos).
walk_collector:
  vendor: Huawei
  model: MA5608T
  expect_sysdescr_regex: Huawei|MA56|MA58|SmartAX
  snmp:
    version: 2c
    host_env: TKC_HUAWEI_HOST
    port_env: TKC_HUAWEI_SNMP_PORT
    community_env: TKC_HUAWEI_RO_COMMUNITY
    default_port: 161
    timeout_s: 5
    max_repetitions: 10
    min_repetitions: 1
    preflight_attempts: 3
  pacing:
    inter_request_delay_ms: 250
    inter_task_delay_s: 3
    checkpoint_every_requests: 25
    checkpoint_every_s: 5
  retry:
    max_attempts_per_request: 4
    backoff_base_s: 2
    backoff_max_s: 60
    jitter: 0.2
    final_retry_rounds: 1
    max_stall_pdus: 3
    max_bumps_per_task: 20
  outage:
    sanity_oid: 1.3.6.1.2.1.1.1.0
    wait_s:
    - 30
    - 60
    - 120
    max_outage_min: 10
  safety:
    latency_window: 50
    baseline_samples: 20
    degrade_factor: 4.0
    degrade_min_ms: 1500
    sustain_checks: 3
    pause_s: 120
    max_safety_pauses: 3
    max_runtime_min: 20
  outputs:
    enterprise:
      suffix: ''
      discover: false
      roots:
      - 1.3.6.1.4.1.2011.6.128.1.1.2.50
      - 1.3.6.1.4.1.2011.6.128.1.1.2.52
      - 1.3.6.1.4.1.2011.6.128.1.1.2.63
      - 1.3.6.1.4.1.2011.6.128.1.1.2.64
      - 1.3.6.1.4.1.2011.6.128.1.1.2.65
      - 1.3.6.1.4.1.2011.6.128.1.1.3
      - 1.3.6.1.4.1.2011.6.128.1.1.4
      - 1.3.6.1.4.1.2011.6.128.1.1.5
      - 1.3.6.1.4.1.2011.6.128.1.1.6
  discovery:
    base_depth: 2
    expand: []
    max_children: 500
  paths:
    state_dir: state/walk_collector_targeted/
    publish_dir: docs/walks/partial/targeted/
  publish:
    allow_incomplete: false
  redaction:
    mode: prefixes
    prefixes:
    - .1.3.6.1.4.1.2011.6.128.1.1.2.43.1.4
    - .1.3.6.1.4.1.2011.6.128.1.1.2.43.1.9
    - .1.3.6.1.4.1.2011.6.128.1.1.2.43.1.13
    - .1.3.6.1.4.1.2011.6.128.1.1.2.43.1.14
