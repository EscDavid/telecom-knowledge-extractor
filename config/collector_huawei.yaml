# Recolector de walks para Huawei MA5608T (SmartAX MA56xx) — SNMPv2c de SOLO LECTURA.
# Uso:  .venv/bin/python -m src.walk_collector --config config/collector_huawei.yaml \
#           --no-prompt --max-runtime 18
# Credenciales: TKC_HUAWEI_HOST / TKC_HUAWEI_SNMP_PORT / TKC_HUAWEI_RO_COMMUNITY (.env).
# Los nombres de variable son EXPLÍCITOS (no los TKC_SNMP_* de ZTE): si faltan, falla en
# vez de caminar otro equipo.
walk_collector:
  vendor: Huawei
  model: MA5608T
  expect_sysdescr_regex: "Huawei|MA56|MA58|SmartAX"   # ajustar tras ver sysDescr real
  snmp:
    version: 2c
    host_env: TKC_HUAWEI_HOST
    port_env: TKC_HUAWEI_SNMP_PORT
    community_env: TKC_HUAWEI_RO_COMMUNITY
    default_port: 161
    timeout_s: 5
    max_repetitions: 20        # tope duro (fragmentación UDP); el colector baja solo si falla
    min_repetitions: 1
    preflight_attempts: 3
  pacing:
    inter_request_delay_ms: 100     # más suave que en ZTE: se desconoce la carga de la MA5608T
    inter_task_delay_s: 3
    checkpoint_every_requests: 25
    checkpoint_every_s: 5
  retry:
    max_attempts_per_request: 4
    backoff_base_s: 2
    backoff_max_s: 60
    jitter: 0.2
    final_retry_rounds: 1
    max_stall_pdus: 3
    max_bumps_per_task: 20
  outage:
    sanity_oid: "1.3.6.1.2.1.1.1.0"
    wait_s: [30, 60, 120]
    max_outage_min: 10
  safety:
    latency_window: 50
    baseline_samples: 20
    degrade_factor: 4.0
    degrade_min_ms: 1500
    sustain_checks: 3
    pause_s: 120
    max_safety_pauses: 3
    max_runtime_min: 20             # tope duro de esta configuración
  outputs:
    entities:                       # primero lo pequeño y estándar
      suffix: "_entities"
      roots: ["1.3.6.1.2.1.47.1.1.1.1"]
      discover: false
    ifnames:
      suffix: "_ifnames"
      roots: ["1.3.6.1.2.1.2.2.1", "1.3.6.1.2.1.31.1.1.1.1"]
      discover: false
    enterprise:
      suffix: ""
      roots:
        - "1.3.6.1.2.1.1"                   # system (sysDescr/sysObjectID/uptime)
        - "1.3.6.1.4.1.2011.6.3"            # HUAWEI-DEVICE-MIB (frame/slot/board/port/cpu)
        - "1.3.6.1.4.1.2011.5.25.31"        # HUAWEI-ENTITY-EXTENT-MIB (estado, temperatura, óptica)
        - "1.3.6.1.4.1.2011.2.6.7"          # HWMUSA-DEV-MIB (placa/CPU/temperatura legacy)
        - "1.3.6.1.4.1.2011.5.100"          # HUAWEI-GPON-MIB (¿implementada?)
        - "1.3.6.1.4.1.2011.6.128"          # HUAWEI-XPON-MIB (ONT, DDM, perfiles, estadísticas)
      discover: false
  discovery:
    base_depth: 2
    expand: []
    max_children: 500
  paths:
    state_dir: state/walk_collector/
    publish_dir: docs/walks/
  publish:
    allow_incomplete: false
  redaction:                   # PII/credenciales: STRING bajo estos prefijos se enmascara al ensamblar
    mode: prefixes
    prefixes:
      - ".1.3.6.1.4.1.2011.6.128.1.1.2.43.1.4"    # ONT password
      - ".1.3.6.1.4.1.2011.6.128.1.1.2.43.1.9"    # ONT description (nombres de abonado)
      - ".1.3.6.1.4.1.2011.6.128.1.1.2.43.1.13"   # LOID
      - ".1.3.6.1.4.1.2011.6.128.1.1.2.43.1.14"   # checkcode
      - ".1.3.6.1.4.1.2011.6.128.1.1.2.48.1.3"    # autofind password
      - ".1.3.6.1.4.1.2011.6.128.1.1.2.48.1.9"    # autofind LOID
      - ".1.3.6.1.4.1.2011.6.128.1.1.2.48.1.10"   # autofind checkcode
      - ".1.3.6.1.4.1.2011.6.128.1.1.2.52.1.7"    # register password
      - ".1.3.6.1.4.1.2011.6.128.1.1.2.52.1.12"   # register LOID
      - ".1.3.6.1.4.1.2011.6.128.1.1.2.52.1.13"   # register checkcode
      - ".1.3.6.1.4.1.2011.5.100.1.1.1.5.1.5"     # GPON-MIB ONT password
      - ".1.3.6.1.4.1.2011.5.100.1.1.1.5.1.14"    # GPON-MIB ONT description
      - ".1.3.6.1.4.1.2011.5.100.1.1.1.5.1.38"    # LOID
      - ".1.3.6.1.4.1.2011.5.100.1.1.1.5.1.39"    # checkcode
      - ".1.3.6.1.4.1.2011.5.100.1.1.1.9.1.3"
      - ".1.3.6.1.4.1.2011.5.100.1.1.1.9.1.9"
      - ".1.3.6.1.4.1.2011.5.100.1.1.1.9.1.10"
      - ".1.3.6.1.4.1.2011.5.100.1.1.2.1.1.7"
      - ".1.3.6.1.4.1.2011.5.100.1.1.2.1.1.12"
      - ".1.3.6.1.4.1.2011.5.100.1.1.2.1.1.13"
