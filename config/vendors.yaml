# =============================================================================
# Perfiles de vendor del TKC — TODO lo que es específico de un fabricante vive aquí.
# El código (src/profiles.py) no contiene OIDs, nombres de interfaz ni fórmulas de
# ningún vendor: lee este archivo. Para soportar un vendor nuevo se agrega un bloque,
# no se edita Python.
#
# Convención de estado de cada valor:
#   (sin marca)      verificado contra hardware o MIB oficial del vendor
#   # DRAFT          hipótesis tomada de fuentes de terceros; NO usar como verdad
#                    hasta confirmarla con un walk real del equipo
# Un campo en null significa "no se conoce": el pipeline OMITE esa validación en
# vez de suponer valores de otro vendor.
# =============================================================================

ZTE:
  technology: gpon
  enterprise_oid: "1.3.6.1.4.1.3902"
  seed_family: "ZXA10 C320"            # backbone teórico (Fase 1) que se especializa por walk
  families:                            # token MODELO del nombre de walk → familia
    C300: "ZXA10 C300"
    C320: "ZXA10 C320"
    C600: "ZXA10 C600"
    C620: "ZXA10 C620"
  single_shelf: true                   # todos los ZXA10 C3xx/C6xx del proyecto: rack=1
  ifname:
    regex: null                        # null → últimos 3 números del ifName = rack/slot/port
    pon_keywords: [pon]
    uplink_keywords: [uplink, gei, xge, eth, gigabit]
  iftype: {pon: 250, uplink: 6}        # IANAifType: gpon(250), ethernetCsmacd(6)
  # ifIndex a nivel de PON port (sin ONU): formula observada en C3xx/C6xx
  pon_port_index:
    space: ONU-ID
    formula: "suffix = 285278208 + slot*256 + pon"
    shelf: 1
  # índice compuesto bit-packed de 32 bits (Fase 1: detección en MIBs)
  bit_index:
    min_keyword_hits: 2
    keywords: [shelf, slot, port, onu]
    default_bits: {shelf: "31-28", slot: "27-24", port: "23-20", onu: "19-0"}
  # tabla ONU cuya columna vendor se usa para contar ONUs por PON port.
  # Instancia = <oid>.<port>.<onu>
  onu_count_source:
    oid: "1.3.6.1.4.1.3902.1012.3.50.11.2.1.1."
    port_pos: 0
    onu_pos: 1
    label: ".1012.3.50.11.2.1"
  # inventario de software: la tabla del catálogo no responde en estos equipos y el
  # firmware lo expone en una rama alternativa
  software_branches:
    catalog_prefix: "1.3.6.1.4.1.3902.1082.20.30."
    alt_branch: "1.3.6.1.4.1.3902.1015.2.1.2.4"
  # prefijos (snake_case) que se recortan de los nombres MIB al derivar la métrica
  metric_prefixes: [zx_an_gpon_, zx_an_, zx_, hw_]
  # ramas cuyo ÍNDICE es texto sensible (comunidades, cuentas, peticiones web)
  sensitive_prefixes:
    - "1.3.6.1.4.1.3902.3.6000.101.2.3"
    - "1.3.6.1.4.1.3902.3.6000.51.2"
    - "1.3.6.1.4.1.3902.3.101.7.5"
    - "1.3.6.1.4.1.3902.1082.20.5.2.1"     # clásicas (C300/C320): 2 pares de cadenas de 12 caracteres con acceso 1/2 (probables comunidades SNMP)
  prune_mode: all                      # walk completo del enterprise: lo no confirmado se poda
  refinements: zte_c6xx                # hook posterior (src/walk_validator/refinements.py)
  legacy_env: true                     # TKC_SNMP_*/TKC_TELNET_* del .env histórico pertenecen a ZTE

Huawei:
  technology: gpon
  enterprise_oid: "1.3.6.1.4.1.2011"
  seed_family: null                    # null → semilla = la propia familia (Fase 1 de MA5608T, generada desde MIBs;
                                       # ver docs/adaptacion_multivendor.md)
  families:
    MA5608T: "MA5608T"                 # sysObjectID 1.3.6.1.4.1.2011.2.248 CONFIRMADO por SNMP (2026-10-22)
  single_shelf: true                   # entPhysical: 1 chasis (clase 3, H801MABR), frame 0 constante
  # Confirmado con walk real (2026-10-22): ifName "GPON 0/<slot>/<puerto>" (últimos 3 números =
  # frame/slot/puerto), ifType PON=250 (32 puertos), uplink "ethernet0/3/x"=6.
  ifname: {regex: null, pon_keywords: [pon], uplink_keywords: [ethernet, gigabit]}
  iftype: {pon: 250, uplink: 6}
  # ifIndex de PON = 4194304000 + slot*8192 + puerto*256: 32 de 32 puertos coinciden (slot 0-1,
  # puertos 0-15). La anchura del campo slot solo está observada con 2 slots → no extrapolar.
  pon_port_index:
    space: IFINDEX
    formula: "ifIndex = 4194304000 + slot*8192 + port*256"
    shelf: 0
  bit_index: null                      # Huawei indexa por ifIndex + ontId (enteros separados), no bit-packed
  # HUAWEI-XPON-MIB hwGponDeviceOntControlInfoTable (.46) RunStatus: índice ifIndex.ontId,
  # 1073 ONT en 31 PON con datos reales.
  onu_count_source:
    oid: "1.3.6.1.4.1.2011.6.128.1.1.2.46.1.15."
    port_pos: 0
    onu_pos: 1
    label: "hwGponDeviceOntControlInfoTable RunStatus"
  software_branches: null
  metric_prefixes: [hw_gpon_device_, hw_xpon_device_, hw_gpon_, hw_xpon_, hw_]
  # Hallado 2026-10-27 en el walk real (HUAWEI-DEVICE-MIB, nunca ingerido como OID — solo
  # como índice ASCII en findings, ver triggers.trigger_ascii_index): .6.3.10 es una tabla
  # de cuentas con el usuario en claro como índice (smaroltusr, supercable, commonuser,
  # operator); .6.3.14 trae tokens de 12 caracteres alfanuméricos de alta entropía (claves/
  # sesión, tabla sin identificar aún) — ambas se tratan como sensibles por precaución.
  # NO incluye .6.128.1 (perfiles DBA/T-CONT con nombre real, ej. "MNZ-HSI-I",
  # "SMARTOLT_DEFAULT_TCONT_1G"): son nombres de configuración legítimos, no secretos.
  sensitive_prefixes:
    - "1.3.6.1.4.1.2011.6.3.10"
    - "1.3.6.1.4.1.2011.6.3.14"
  prune_mode: covered_branch           # walks parciales por subárbol: solo se poda donde se caminó
  prune_branch_depth: 2                # 2011.<rama>.<subrama>: 6.128, 5.100, 6.3, 5.25 ...
  ent_module_refine: true              # fan box / power board vienen como entPhysicalClass=module
  # backlog #8 (2026-10-26): entPhysicalTable real confirma class=3 chassis (1 fila, shelf) y
  # class=9 module (7 filas, card/fan/power por texto); pero HUAWEI-XPON-MIB no define esas
  # entidades (hardware vive en HUAWEI-DEVICE-MIB, nunca ingerido) así que la semilla no las
  # tiene. class=10 "port" (34 filas) y class=11 "stack" (65 filas "RACK-300") quedan sin
  # mapear a propósito: no son tarjetas, ENT_CLASS_TO_SHORT no las necesita.
  ent_synthesize_from_walk: true
  refinements: null

VSOL:
  technology: gpon
  enterprise_oid: "1.3.6.1.4.1.37950"  # MIB V1600D (vsolution ::= enterprises 37950) + detección de LibreNMS (.37950.)
  seed_family: null                    # null → semilla = la propia familia (Fase 1 de ese modelo)
  families:
    V1600G: "V1600G"
    V1600G2B: "V1600G2B"               # sysDescr/oltType reales (2026-10-22); sysObjectID 37950.1.1.5.10.14.1
    V1600GS: "V1600GS"
  single_shelf: null
  ifname: {regex: null, pon_keywords: [pon], uplink_keywords: [gigabit, eth, ge]}   # DRAFT
  iftype: {pon: 250, uplink: 6}        # DRAFT
  pon_port_index: null
  bit_index: null
  onu_count_source: null
  software_branches: null
  sensitive_prefixes: []
  prune_mode: covered_branch
  prune_branch_depth: 2
  refinements: null
